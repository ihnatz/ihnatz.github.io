---
layout: default
---
<div id="progress-indicator"></div>

<div class="post">
  <header class="post-header">
    <h2 class="post-title">{{ page.title }}</h2>
    {% if page.subtitle %}
      <h4 class="post-subtitle">{{ page.subtitle }}</h4>
    {% endif %}
    <span class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</span>
  </header>

  <article>
    {{ content }}
  </article>
</div>

<script src='/javascripts/progressbar.js' type="text/javascript"></script>
